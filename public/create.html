<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrewUp | Create Opportunity</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
  <script type="module" src="js/firebase-init.js"></script>
</head>
<body>
  <header class="header container">
    <div class="brand"><strong>CrewUp</strong></div>
    <nav>
      <a href="explore.html">Explore</a> |
      <a href="create.html">Create</a> |
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="container">
    <h2>Create Opportunity</h2>
    <form id="createForm" class="form card">
      <input id="title" required placeholder="Project title" />
      <textarea id="description" required placeholder="Describe the project"></textarea>
      <input id="roles" placeholder="Roles (comma separated)"/>
      <input id="skills" placeholder="Required skills (comma separated)" />
      <button type="submit">Create Opportunity</button>
    </form>
  </main>

  <footer class="footer">© CrewUp</footer>

  <script type="module">
    import { addOpportunity } from './js/opportunities-create.js';
    document.getElementById('createForm').addEventListener('submit', addOpportunity);
  </script>
</body>
</html>
